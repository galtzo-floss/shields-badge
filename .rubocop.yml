inherit_gem:
  rubocop-lts: rubocop-lts.yml
inherit_from:
  - .rubocop_rspec.yml
plugins:
  - rubocop-rspec
  - rubocop-on-rbs
  - rubocop-packaging
# This tells RuboCop to add the exclusions in this file
# to the default exclusions (and those from other inherited files),
# rather than overwriting them.
inherit_mode:
  merge:
    - Exclude

AllCops:
  DisplayCopNames: true # Display the name of the failing cops
  Exclude:
    - 'gemfiles/vendor/**/*'
    - 'vendor/**/*'
    - '**/.irbrc'
RBS:
  Enabled: true
Layout/IndentationConsistency:
  Exclude: ['*.md']
# Appraisal uses this filename for the moving HEAD dependency fixture.
Naming/FileName:
  Exclude:
    - '**/vHEAD.gemfile'
# kettle-jem:freeze
# TruffleRuby 23.x (a supported engine) cannot parse endless method definitions,
# even though MRI 3.0+ can, so rubocop-lts target versions do not catch them.
Style/EndlessMethod:
  Enabled: true
  EnforcedStyle: disallow
# kettle-jem:unfreeze
